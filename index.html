<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f5739">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="LogoGDM.jpeg">
    <link rel="stylesheet" href="estilos.css">
    <title>Acceso | Gestionador de Mensajes</title>
</head>

<body class="pagina-configuracion">
    <main class="configuracion-main">
        <header class="seccion-encabezado">
            <p class="seccion-etiqueta">ACCESO</p>
            <h1>Bienvenido al Gestionador de Mensajes</h1>
            <p>Ingresa tus datos para continuar al inicio.</p>
        </header>

        <section class="container configuracion-card" aria-labelledby="titulo-datos">
            <h2 id="titulo-datos">Datos personales</h2>
            <p class="configuracion-descripcion">Usaremos esta información para personalizar tus mensajes.</p>

            <form id="form-datos-personales" class="configuracion-form">
                <div class="configuracion-campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="given-name" required>
                </div>

                <div class="configuracion-campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" autocomplete="family-name" required>
                </div>

                <div class="configuracion-campo">
                    <label for="congregacion">Congregación y ciudad </label>
                    <input type="text" id="congregacion" name="congregacion" autocomplete="organization" required>
                </div>
                <button type="submit" class="button">Ingresar</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Gestionador de Mensajes. Todos los derechos reservados. La Doble U.</p>
    </footer>

    <script>
        const form = document.getElementById("form-datos-personales");
        const nombreInput = document.getElementById("nombre");
        const apellidoInput = document.getElementById("apellido");
        const congregacionInput = document.getElementById("congregacion");

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            localStorage.setItem("nombreUsuario", nombreInput.value.trim());
            localStorage.setItem("apellidoUsuario", apellidoInput.value.trim());
            localStorage.setItem("congregacionUsuario", congregacionInput.value.trim());
            window.location.href = "Home.html";
        });

    </script>
</body>
</html>
