<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logoGDM.jpeg">
    <link rel="stylesheet" href="estilos.css">
    <meta name="theme-color" content="#0f5739">
    <title>Mensajes Pitch|Gestionador de Mensajes</title>
</head>

<body>

    <style>
        .contenedor {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            background: #FAEBD7;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: space-between;
        }

        .card {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }


        @media (max-width: 900px) {
            .contenedor {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 12px 8px;
            }

            .h1 {
                font-size: 1.6rem;
            }

            .contenedor {
                display: block;
                padding: 12px;
                gap: 12px;
                
            }
        }


        .footer {
            background-color: #000000;
            width: 100%;
            height: auto;
            padding: 10px;
            text-align: center;
            margin-top: auto;
            box-sizing: border-box;
        }


        .select {
            max-width: 1000px;
            width: 100%;
            margin: 20px auto;
            padding: 12px;
            font-size: 1rem;
            background-color: #3d8e66;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: block;
        }

        .mp {
            color: #0f5739;
            font-size: 1.2rem;

        }

        .select:hover {
            background-color: #2d6e4d;
        }

        .select option {
            background-color: #f0f0f0;
            color: #333;
            padding: 8px;
        }

        .btn {
            background-color: #0f5739;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn:hover {
            background-color: #0a3a26;
        }

        .input {
            width: 250px;
            height: 25px;
        }

        .input:focus {
            background-color: #4fe8a8;
        }
    </style>

    <h1 class="h1">Mensajes Pitch</h1>

    <br>

    <nav class="navbar">

        <div class="direccion">
            <a href="index.html">Inicio</a>
        </div>

        <div class="direccion">
            <a href="Mensajes Pitch.html">Mensajes Pitch</a>
        </div>

        <div class="direccion">
            <a href="formularios.html">Formularios</a>
        </div>

        <div class="direccion">
            <a href="Contactos.html">Contactos</a>
        </div>

    </nav>

    <br>

    <main>

        <br>

        <h4 class="h1">Zona de Mensajes</h4>


        <br>
        <div class="contenedor" id="contenedorNombre">
            <input id="nombreConferenciante" class="input" placeholder="Nombre y apellido del conferenciante">
            <button id="agregarNombre" class="btn" type="button">Agregar nombre</button>
        </div>

        <select class="select" id="optionsSelect">
            <option value="" disabled selected> Selecciona una opción de mensaje</option>
        </select>

        <div class="contenedor" id="contenedorMensaje"></div>
    </main>

    <footer class="footer">
        <p class="p">© 2026 Gestionador de Mensajes. Todos los derechos reservados. La Doble U.</p>
    </footer>

    <script>

        let mensajes = [
            "Opción 1: Buenas tardes, hermano. Espero que se encuentre muy bien. Le habla Uriel Uncos, de la congregación Barrio Don Bosco. Quería recordarle que este domingo a las 10:00 tiene la conferencia con nosotros. Desde ya, será un gusto contar con su presencia. ¡Lo esperamos!.",

            "Opción 2: Buenas tardes, hermano. Espero que se encuentre muy bien. Le habla Uriel Uncos, de la congregación Barrio Don Bosco. Quería recordarle que este domingo a las 10:00 tiene la conferencia con nosotros. Desde ya, será un gusto contar con su presencia. ¡Lo esperamos!.",

            "Opción 3: ¡Buenas tardes, hermano! ¿Cómo está? Soy Uriel Uncos, de la congregación Barrio Don Bosco. Le escribo para recordarle que este domingo a las 10:00 tenemos su conferencia. ¡Esperamos poder contar con usted! Que tenga una linda tarde.",

            "Opción 4: Muy buenas tardes, hermano. Espero que se encuentre bien. Mi nombre es Uriel Uncos, de la congregación Barrio Don Bosco. Quería comunicarme con usted para recordarle que este domingo a las 10:00 estará dando la conferencia con nosotros. ¡Será un placer recibirlo!",

            "Opción 5: Buenas tardes, hermano, espero que se encuentre bien. Le habla Uriel Uncos, de la congregación Barrio Don Bosco. Le envío este mensaje para recordarle que este domingo a las 10:00 tiene la conferencia con nosotros. ¡Los esperamos!",

            "Opción 6: ¡Buenas tardes, hermano! Espero que todo ande muy bien. Le escribe Uriel Uncos, de la congregación Barrio Don Bosco, para recordarle que este domingo a las 10:00 estará a cargo de la conferencia. Será un verdadero gusto acompañarle. ¡Nos vemos pronto!"
        ];

        const select = document.getElementById("optionsSelect");
        const contenedor = document.getElementById("contenedorMensaje");
        const nombreInput = document.getElementById("nombreConferenciante");
        const agregarNombreBtn = document.getElementById("agregarNombre");
        let nombreActual = "";

        function crearMensajeConNombre(mensaje, nombre) {
            const nombreLimpio = nombre.trim();

            if (!nombreLimpio) {
                return mensaje;
            }

            return mensaje.replace(/hermano/gi, nombreLimpio);
        }

        function renderMensajeSeleccionado() {
            const indice = select.value;

            if (indice === "" || indice === null) {
                contenedor.innerHTML = "";
                return;
            }

            const textoBase = mensajes[indice];
            const texto = crearMensajeConNombre(textoBase, nombreActual);

            contenedor.innerHTML = "";

            const card = document.createElement("div");
            card.classList.add("card");

            const p = document.createElement("p");
            p.classList.add("mp");
            p.textContent = texto;

            const br = document.createElement("br");
            br.classList.add("mp");

            const boton = document.createElement("button");
            boton.classList.add("btn");
            boton.textContent = "Copiar mensaje";

            boton.addEventListener("click", function () {
                navigator.clipboard.writeText(texto);
                boton.textContent = "¡Copiado!";

                setTimeout(() => {
                    boton.textContent = "Copiar mensaje";
                }, 1500);
            });

            card.appendChild(p);
            card.appendChild(br);
            card.appendChild(boton);
            contenedor.appendChild(card);
        }

        // Crear las opciones del SELECT
        mensajes.forEach((mensaje, indice) => {
            const opcion = document.createElement("option");
            opcion.value = indice;
            opcion.textContent = `Mensaje ${indice + 1}`;
            select.appendChild(opcion);
        });

        agregarNombreBtn.addEventListener("click", function () {
            nombreActual = nombreInput.value;

            if (select.value !== "") {
                renderMensajeSeleccionado();
            }
        });

        nombreInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                nombreActual = nombreInput.value;

                if (select.value !== "") {
                    renderMensajeSeleccionado();
                }
            }
        });

        select.addEventListener("change", renderMensajeSeleccionado);


    </script>

</body>

</html>
