<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="LogoGDM.jpeg">
    <link rel="stylesheet" href="estilos.css">
    <meta name="theme-color" content="#0f5739">
    <title>Mensajes Pitch|Gestionador de Mensajes</title>
</head>

<body class="pagina-pitch">

    <nav class="navbar">
        <div class="direccion"><a href="Home.html">Inicio</a></div>
        <div class="direccion"><a href="Mensajes Pitch.html" class="navActive">Mensajes Pitch</a></div>
        <div class="direccion"><a href="formularios.html">Formularios</a></div>
        <div class="direccion"><a href="Salientes.html">Salientes</a></div>
        <div class="direccion"><a href="Contactos.html">Contactos</a></div>
    </nav>

    <br>

    <main class="pitch-main">
        <header class="pitch-encabezado">
            <p class="pitch-etiqueta">MENSAJES PITCH</p>
            <h1 class="h1">Prepara tu mensaje</h1>
            <p>Personaliza el saludo, elige una opción y copia el texto listo para enviar.</p>
            <p id="estadoNombreUsuario" aria-live="polite"></p>
        </header>

        <div class="contenedor" id="contenedorNombre">
            <div class="pitch-campo">
                <label for="nombreConferenciante">Nombre del conferenciante</label>
                <input id="nombreConferenciante" class="input" placeholder="Ej.: Juan Pérez">
            </div>

            <div class="pitch-campo">
                <label for="NombreConferencial">Nombre de la conferencia</label>
                <input id="NombreConferencial" class="input" placeholder="Nombre Conferencia">
            </div>

            <div class="pitch-campo">
                <label for="NumeroConferencial">Número de la conferencia</label>
                <input id="NumeroConferencial" class="input" placeholder="Número Conferencia" type="number" min="1">
            </div>


            <button id="agregarNombre" class="btn" type="button">Tomar Información</button>
        </div>

        <div class="pitch-selector">
            <label for="optionsSelect">1. Elige una opción de mensaje</label>
            <select class="select" id="optionsSelect">
                <option value="" disabled selected>Selecciona un mensaje</option>
            </select>
        </div>

        <div class="contenedor" id="contenedorMensaje"></div>
    </main>


    <nav aria-label="Paginación de la página">

        <ul class="pagination">
            <li><a href="Home.html">1</a></li>
            <li><a href="Mensajes Pitch.html" class="active">2</a></li>
            <li><a href="formularios.html">3</a></li>
            <li><a href="Salientes.html">4</a></li>
            <li><a href="Contactos.html">5</a></li>

        </ul>

    </nav>


    <footer class="footer">
        <p class="p">© 2026 Gestionador de Mensajes. Todos los derechos reservados. La Doble U.</p>
    </footer>

    <script>

let mensajes = [
    "Buenas tardes, hermano. Espero que se encuentre muy bien. Le habla {{nombreUsuario}}, de la congregación Barrio Don Bosco. Le escribo para recordarle que este domingo a las 10:00 tendremos el gusto de recibirlo para la conferencia. ¡Lo esperamos con mucho gusto!",

    "¡Buenas tardes, hermano! ¿Cómo está? Soy {{nombreUsuario}}, de la congregación Barrio Don Bosco. Quería recordarle que este domingo a las 10:00 tenemos programada su conferencia. Desde ya, muchas gracias por su disposición. ¡Será un gusto recibirlo!",

    "Muy buenas tardes, hermano. Espero que esté pasando una linda semana. Le escribe {{nombreUsuario}}, de la congregación Barrio Don Bosco, para recordarle que este domingo a las 10:00 lo esperamos para su conferencia. ¡Que tenga una excelente tarde!",

    "Buenas tardes, hermano. Espero que se encuentre bien. Mi nombre es {{nombreUsuario}} y le escribo de la congregación Barrio Don Bosco. Quería recordarle que este domingo a las 10:00 presentará la conferencia titulada «{{nombreConferencia}}». ¡Será un placer contar con su presencia!",

    "¡Hola, hermano! Muy buenas tardes. Espero que se encuentre muy bien. Soy {{nombreUsuario}}, de la congregación Barrio Don Bosco. Me comunico para recordarle que este domingo a las 10:00 lo estaremos esperando para la conferencia. ¡Desde ya, muchas gracias y hasta el domingo!",

    "Buenas tardes, hermano. ¿Cómo está? Le habla {{nombreUsuario}}, de la congregación Barrio Don Bosco. Quería recordarle que este domingo a las 10:00 estará a cargo de la conferencia número {{numeroConferencia}}, titulada «{{nombreConferencia}}». Será un gusto recibirlo y compartir ese momento con usted. ¡Lo esperamos!"
];


        const select = document.getElementById("optionsSelect");
        const contenedor = document.getElementById("contenedorMensaje");
        const nombreInput = document.getElementById("nombreConferenciante");
        const agregarNombreBtn = document.getElementById("agregarNombre");
        const estadoNombreUsuario = document.getElementById("estadoNombreUsuario");
        const nombreConferenciaInput = document.getElementById("NombreConferencial");
        const numeroConferenciaInput = document.getElementById("NumeroConferencial");
        const boton = document.getElementById("agregarNombre");


        const nombreUsuario = [
            localStorage.getItem("nombreUsuario"),
            localStorage.getItem("apellidoUsuario")
        ].filter(Boolean).join(" ").trim();
        let nombreActual = "";

        if (nombreUsuario) {
            estadoNombreUsuario.textContent = `Los mensajes usarán tu nombre: ${nombreUsuario}.`;
        } else {
            estadoNombreUsuario.textContent = "Configura tu nombre y apellido en Inicio para personalizar los mensajes.";
        }

        function crearMensajeConNombre(mensaje, nombre) {
            const nombreLimpio = nombre.trim();
            const mensajeConNombreUsuario = mensaje.replace(/\{\{nombreUsuario\}\}/g, nombreUsuario);
            const mensajeConNombreConferencia = mensajeConNombreUsuario.replace(/\{\{nombreConferencia\}\}/g, nombreConferenciaInput.value || "la conferencia");
            const mensajeConNumeroConferencia = mensajeConNombreConferencia.replace(/\{\{numeroConferencia\}\}/g, numeroConferenciaInput.value || "el número de conferencia");
            if (!nombreLimpio) {
                return mensajeConNumeroConferencia;
            }

            return mensajeConNumeroConferencia
                .replace(/hermano/gi, nombreLimpio);
        }

        function renderMensajeSeleccionado() {
            const indice = select.value;

            if (indice === "" || indice === null) {
                contenedor.innerHTML = "";
                return;
            }

            if (!nombreUsuario) {
                contenedor.textContent = "";
                const aviso = document.createElement("p");
                aviso.textContent = "Para generar el mensaje, primero ingresa tu nombre y apellido en ";
                const enlace = document.createElement("a");
                enlace.href = "index.html";
                enlace.textContent = "Inicio";
                aviso.appendChild(enlace);
                contenedor.appendChild(aviso);
                return;
            }

            const textoBase = mensajes[indice];
            const texto = crearMensajeConNombre(textoBase, nombreActual);

            contenedor.innerHTML = "";

            const card = document.createElement("div");
            card.classList.add("card");

            const p = document.createElement("p");
            p.classList.add("mp");
            p.textContent = texto;

            const br = document.createElement("br");
            br.classList.add("mp");

            const boton = document.createElement("button");
            boton.classList.add("btn");
            boton.textContent = "Copiar mensaje";

            boton.addEventListener("click", function () {
                navigator.clipboard.writeText(texto);
                boton.textContent = "¡Copiado!";

                setTimeout(() => {
                    boton.textContent = "Copiar mensaje";
                }, 1500);
            });

            card.appendChild(p);
            card.appendChild(br);
            card.appendChild(boton);
            contenedor.appendChild(card);
        }

        // Crear las opciones del SELECT
        mensajes.forEach((mensaje, indice) => {
            const opcion = document.createElement("option");
            opcion.value = indice;
            opcion.textContent = `Mensaje ${indice + 1}`;
            select.appendChild(opcion);
        });

        agregarNombreBtn.addEventListener("click", function () {
            nombreActual = nombreInput.value;

            if (select.value !== "") {
                renderMensajeSeleccionado();
            }
        });



    </script>

</body>

</html>
