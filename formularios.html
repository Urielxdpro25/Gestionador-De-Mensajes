<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="LogoGDM.jpeg">
    <link rel="stylesheet" href="estilos.css">
    <meta name="theme-color" content="#0f5739">
    <title>Formularios|Gestionador de Mensajes</title>

    <style>
        .form {
            background: rgba(255, 255, 255, .95);
            width: 100%;
            max-width: 560px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .2);
        }

        fieldset {
            border: 1px solid #d6e8df;
            border-radius: 10px;
            padding: 15px;
        }

        legend {
            color: #0f5739;
            font-weight: bold;
            padding: 0 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #20493b;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 10px;
            font-size: 17px;
            border-radius: 8px;
            border: 1px solid #c7d9d1;
        }

        input:focus {
            outline: none;
            border-color: #1fe099;
            box-shadow: 0 0 0 3px rgba(31, 224, 153, .25);
        }

        .btn {
            width: 100%;
            height: 55px;
            margin-top: 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #1fe099);
            transition: .3s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .Forms {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .Forms {
                display: grid;
                grid-template-columns: repeat(1, 1fr);

            }

        }

        #mensajeCopiado {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f5739;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            display: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h1 class="h1">Formularios</h1>


    <nav class="navbar">

        <div class="direccion">
            <a href="index.html">Inicio</a>
        </div>

        <div class="direccion">
            <a href="Mensajes Pitch.html">Mensajes Pitch</a>
        </div>

        <div class="direccion">
            <a href="formularios.html">Formularios</a>
        </div>

        <div class="direccion">
            <a href="Contactos.html">Contactos</a>
        </div>

    </nav>

    <br>

    <div class="Forms"> <!--los dos formularios-->

        <form id="form-conferenciante" class="form">

            <fieldset>

                <legend>Información Conferenciante</legend>

                <label for="nombre">Nombre y apellido Conferenciante:</label>
                <input type="text" id="nombre">


                <label for="titulo">Título Conferencia:</label>
                <input type="text" id="titulo">

                <label for="numero">Número Conferencia:</label>
                <input type="text" id="numero">

                <label for="titulo-Cantico">Título Cántico:</label>
                <input type="text" id="titulo-Cantico">

                <label for="numero-Cantico">Número Cántico:</label>
                <input type="text" id="numero-Cantico">

                <label for="nombre-Congregacion">Nombre Congregación Conferenciante:</label>
                <input type="text" id="nombre-Congregacion">

            </fieldset>

        </form>


        <form id="form-mensaje" class="form">

            <fieldset>

                <legend>Información del Mensaje</legend>

                <label for="nom-Presidente" class="presidente">Nombre y Apellido Presidente:</label>
                <input type="text" id="nom-Presidente">

                <label for="oracion-Ini">Oración Inicial:</label>
                <input type="text" id="oracion-Ini">

                <label for="nom-Lector">Nombre y Apellido Lector:</label>
                <input type="text" id="nom-Lector">

                <label for="oracion-Fin">Oración Final:</label>
                <input type="text" id="oracion-Fin">



            </fieldset>
        </form>


    </div><!--div contendor de los 2 formularios-->

    <button type="button" class="btn" onclick="copiarFormulario('form-mensaje')">
        Copiar al Portapapeles
    </button>

    <br>
    <button class="btn" onclick="window.location.href='index.html'">Volver al Inicio</button>

    <div id="mensajeCopiado">
        ¡Información copiada al portapapeles!
    </div>


    <footer class="footer">
        <p class="p">© 2026 Gestionador de Mensajes. Todos los derechos reservados. La Doble U.</p>
    </footer>




    <script>
        function copiarFormulario() {

            // 1. Construcción de la cadena con formato estructurado
            const texto = ` Hola  ${document.getElementById("nom-Presidente").value}, aquí tienes la información del conferenciante:

Información del conferenciante:
Nombre y Apellido Conferenciante: ${document.getElementById("nombre").value}
Título Conferencia: ${document.getElementById("titulo").value}
Número Conferencia: ${document.getElementById("numero").value}
Título Cántico: ${document.getElementById("titulo-Cantico").value}
Número Cántico: ${document.getElementById("numero-Cantico").value}
Nombre Congregación Conferenciante: ${document.getElementById("nombre-Congregacion").value}

Información de la reunión:
Nombre y Apellido Presidente: ${document.getElementById("nom-Presidente").value}
Oración Inicial: ${document.getElementById("oracion-Ini").value}
Nombre y Apellido Lector: ${document.getElementById("nom-Lector").value}
Oración Final: ${document.getElementById("oracion-Fin").value}`;

            // 2. Copiar al portapapeles y mostrar feedback al usuario
            navigator.clipboard.writeText(texto)
                .then(() => {
                    const mensajeCopiado = document.getElementById("mensajeCopiado");
                    mensajeCopiado.style.display = "block";

                    // Oculta el mensaje automáticamente después de 3 segundos
                    setTimeout(() => {
                        mensajeCopiado.style.display = "none";
                    }, 3000);
                })
                .catch(err => {
                    console.error("Error al copiar el texto: ", err);
                });
        }


        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("Service Worker registrado"))
                .catch(err => console.log(err));

        }

    </script>

</body>

</html>
